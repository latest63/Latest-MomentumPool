<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 300" fill="none">
  <!-- Stadium scene -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A0E2A"/>
      <stop offset="100%" stop-color="#1A2A5A"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A5A2A"/>
      <stop offset="100%" stop-color="#0D3A18"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="500" height="300" fill="url(#sky)"/>
  <!-- Floodlights -->
  <circle cx="80" cy="60" r="25" fill="rgba(255,255,200,0.15)"/>
  <circle cx="420" cy="60" r="25" fill="rgba(255,255,200,0.12)"/>
  <circle cx="250" cy="50" r="30" fill="rgba(255,255,200,0.1)"/>
  <!-- Light beams -->
  <path d="M80,60 L0,200 L50,200 Z" fill="rgba(255,255,200,0.03)"/>
  <path d="M420,60 L500,200 L450,200 Z" fill="rgba(255,255,200,0.03)"/>
  <!-- Stands -->
  <rect x="0" y="100" width="500" height="60" fill="rgba(20,30,60,0.6)" rx="4"/>
  <rect x="0" y="110" width="500" height="50" fill="rgba(30,40,70,0.4)" rx="2"/>
  <!-- Crowd dots -->
  <g opacity="0.5">
    <circle cx="30" cy="120" r="2" fill="#fff"/><circle cx="50" cy="125" r="2" fill="#fff"/>
    <circle cx="70" cy="118" r="2" fill="#fff"/><circle cx="90" cy="128" r="2" fill="#fff"/>
    <circle cx="110" cy="122" r="2" fill="#fff"/><circle cx="130" cy="115" r="2" fill="#fff"/>
    <circle cx="150" cy="126" r="2" fill="#fff"/><circle cx="170" cy="120" r="2" fill="#fff"/>
    <circle cx="190" cy="130" r="2" fill="#fff"/><circle cx="210" cy="118" r="2" fill="#fff"/>
    <circle cx="230" cy="124" r="2" fill="#fff"/><circle cx="250" cy="116" r="2" fill="#fff"/>
    <circle cx="270" cy="128" r="2" fill="#fff"/><circle cx="290" cy="122" r="2" fill="#fff"/>
    <circle cx="310" cy="118" r="2" fill="#fff"/><circle cx="330" cy="126" r="2" fill="#fff"/>
    <circle cx="350" cy="120" r="2" fill="#fff"/><circle cx="370" cy="128" r="2" fill="#fff"/>
    <circle cx="390" cy="115" r="2" fill="#fff"/><circle cx="410" cy="125" r="2" fill="#fff"/>
    <circle cx="430" cy="122" r="2" fill="#fff"/><circle cx="450" cy="118" r="2" fill="#fff"/>
    <circle cx="470" cy="128" r="2" fill="#fff"/>
  </g>
  <!-- Pitch -->
  <rect x="0" y="160" width="500" height="140" fill="url(#pitch)"/>
  <!-- Pitch lines -->
  <line x1="0" y1="200" x2="500" y2="200" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <line x1="250" y1="160" x2="250" y2="300" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- Goal -->
  <rect x="0" y="200" width="15" height="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <rect x="485" y="200" width="15" height="60" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
</svg>

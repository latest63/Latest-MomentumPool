<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Football with dynamic effects -->
  <circle cx="50" cy="50" r="45" fill="white" stroke="#111" stroke-width="2"/>
  <!-- Pentagon pattern -->
  <path d="M50,20 L68,33 L63,55 L37,55 L32,33 Z" fill="#111" opacity="0.15"/>
  <path d="M50,20 L68,33 L63,55 L37,55 L32,33 Z" fill="none" stroke="#111" stroke-width="1.5"/>
  <!-- Highlight -->
  <ellipse cx="38" cy="35" rx="8" ry="5" fill="white" opacity="0.4" transform="rotate(-30,38,35)"/>
  <!-- Motion effect -->
  <path d="M75,25 Q85,15 95,10" stroke="rgba(36,83,190,0.6)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M80,30 Q88,22 98,18" stroke="rgba(0,229,255,0.4)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>

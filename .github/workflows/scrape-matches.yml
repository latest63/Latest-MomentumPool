name: Scrape Matches Daily

on:
  schedule:
    # Midnight UTC = 1am Nigerian time (WAT, UTC+1)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel scrape endpoint
        run: |
          curl -sSf "https://momentum-pool.vercel.app/api/cron/scrape"
